<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Своя Игра — Викторина с мультимедиа</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.8);
            --bg-glass: rgba(30, 41, 59, 0.6);
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.4);
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gold: #fbbf24;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(148, 163, 184, 0.15);
            --radius: 16px;
            --radius-lg: 24px;
            --radius-full: 9999px;
        }

        body {
            background: var(--bg-primary);
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(16, 185, 129, 0.06) 0%, transparent 50%);
            min-height: 100vh;
            color: var(--text);
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ─── Top Bar ─── */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-glass);
            backdrop-filter: blur(20px) saturate(1.4);
            -webkit-backdrop-filter: blur(20px) saturate(1.4);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 12px 28px;
            margin-bottom: 24px;
        }
        .menu-btn {
            background: var(--accent);
            color: white;
            font-size: 1rem;
            padding: 10px 24px;
            border: none;
            border-radius: var(--radius-full);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .menu-btn:hover {
            background: var(--accent-light);
            box-shadow: 0 0 20px var(--accent-glow);
        }
        .quiz-name-badge {
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent-light);
            padding: 8px 22px;
            border-radius: var(--radius-full);
            font-weight: 600;
            font-size: 0.9rem;
            border: 1px solid rgba(99, 102, 241, 0.25);
        }

        /* ─── Modals ─── */
        .modal-menu, .modal {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-menu { z-index: 2000; }
        .modal-card, .modal-menu-card {
            background: var(--bg-secondary);
            color: var(--text);
            width: 90%;
            max-width: 500px;
            border-radius: var(--radius-lg);
            padding: 32px;
            border: 1px solid var(--border);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.03);
            animation: modalIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-card h2, .modal-card h3, .modal-menu-card h3 {
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 1.25rem;
        }
        .modal-card h2 { color: var(--text); }
        .modal-card h3, .modal-menu-card h3 { color: var(--accent-light); }
        .modal-card input, .modal-card select,
        .menu-group input, .menu-group select {
            width: 100%;
            padding: 12px 16px;
            margin: 10px 0;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text);
            font-size: 0.95rem;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .modal-card input:focus, .modal-card select:focus,
        .menu-group input:focus, .menu-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }
        .menu-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }
        .menu-group button, .menu-group select, .menu-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text);
            font-size: 0.95rem;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .modal-buttons button {
            flex: 1 1 auto;
            padding: 12px 20px;
            border-radius: var(--radius);
            border: none;
            font-weight: 600;
            cursor: pointer;
            min-width: 90px;
            transition: all 0.2s;
        }

        /* ─── Buttons ─── */
        button {
            background: var(--bg-primary);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        button:hover {
            background: var(--bg-secondary);
            border-color: rgba(148, 163, 184, 0.3);
        }
        button:active { transform: scale(0.97); }
        button.danger { background: var(--danger); color: white; border-color: transparent; }
        button.danger:hover { background: #dc2626; }
        button.success { background: var(--success); color: white; border-color: transparent; }
        button.success:hover { background: #059669; }
        button.warning { background: var(--warning); color: white; border-color: transparent; }
        button.warning:hover { background: #d97706; }

        /* ─── Teams Panel ─── */
        .teams-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
        }
        .teams-header {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }
        .teams-header strong {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
        }
        .teams-list {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .team-card {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 24px;
            min-width: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .team-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-lg);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .team-card.active {
            border-color: var(--accent);
            background: rgba(99, 102, 241, 0.08);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.15), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .team-card.active::before {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), transparent);
            opacity: 1;
        }
        .team-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text);
        }
        .team-score {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent-light), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .team-actions {
            margin-top: 12px;
            display: flex;
            gap: 6px;
        }
        .team-actions button {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: var(--radius-full);
            background: rgba(99, 102, 241, 0.12);
            color: var(--accent-light);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }
        .team-actions button:hover {
            background: rgba(99, 102, 241, 0.2);
        }

        /* ─── Game Grid ─── */
        .game-grid {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            overflow-x: auto;
        }
        .categories-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 8px;
            text-align: center;
        }
        .categories-table th {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: white;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            padding: 16px 12px;
            border-radius: var(--radius);
            border: none;
        }
        .categories-table td {
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            background: var(--bg-primary);
            color: var(--text);
            padding: 18px 8px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .categories-table td.used {
            background: rgba(30, 41, 59, 0.5);
            color: var(--text-muted);
            cursor: not-allowed;
            text-decoration: line-through;
            opacity: 0.4;
            border-color: transparent;
        }
        .categories-table td:hover:not(.used) {
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.35);
            border-color: transparent;
        }

        /* ─── Question Modal ─── */
        .question-text {
            font-size: 1.2rem;
            font-weight: 500;
            line-height: 1.6;
            margin: 20px 0;
            background: rgba(99, 102, 241, 0.06);
            padding: 24px;
            border-radius: var(--radius);
            border: 1px solid rgba(99, 102, 241, 0.12);
            color: var(--text);
        }
        .media-container {
            margin: 15px 0;
            text-align: center;
        }
        .media-container img, .media-container video {
            max-width: 100%;
            max-height: 280px;
            border-radius: var(--radius);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        .timer-area {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 16px;
            border-radius: var(--radius);
            text-align: center;
            margin: 18px 0;
            font-size: 2rem;
            font-weight: 800;
            font-family: 'Inter', monospace;
            letter-spacing: 4px;
        }
        @media (max-width: 500px) {
            .timer-area { font-size: 1.5rem; }
        }

        #answerReveal {
            margin-top: 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: var(--radius);
            padding: 16px;
            color: var(--success);
            font-weight: 600;
        }

        /* ─── Editor ─── */
        .editor-modal .modal-card {
            max-width: 1200px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .editor-modal .modal-card::-webkit-scrollbar {
            width: 6px;
        }
        .editor-modal .modal-card::-webkit-scrollbar-track {
            background: transparent;
        }
        .editor-modal .modal-card::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        .editor-category {
            background: rgba(99, 102, 241, 0.06);
            border: 1px solid rgba(99, 102, 241, 0.12);
            margin-bottom: 16px;
            padding: 20px;
            border-radius: var(--radius);
        }
        .editor-category strong {
            font-size: 0.95rem;
            color: var(--accent-light);
        }
        .question-row {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            margin: 8px 0;
            padding: 12px;
            border-radius: var(--radius);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .question-row input {
            flex: 1 1 110px;
            padding: 10px 14px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text);
            font-size: 0.9rem;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .question-row input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .question-row button {
            padding: 8px 14px;
            border-radius: var(--radius);
            font-size: 0.85rem;
        }

        hr {
            border: none;
            height: 1px;
            background: var(--border);
            margin: 20px 0;
        }
        .info-badge {
            background: rgba(99, 102, 241, 0.12);
            color: var(--accent-light);
            border-radius: var(--radius-full);
            padding: 8px 16px;
            font-size: 13px;
            display: inline-block;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        /* ─── Scrollbar ─── */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.35); }
    </style>
</head>
<body>
<div class="app-container">
    <div class="top-bar">
        <button id="openMenuBtn" class="menu-btn">☰ Меню</button>
        <div class="quiz-name-badge" id="currentQuizNameBadge"></div>
    </div>

    <div id="menuModal" class="modal-menu">
        <div class="modal-menu-card">
            <h3>⚙️ Управление викториной</h3>
            <div class="menu-group">
                <label>📚 Выбор викторины:</label>
                <select id="quizSelectMenu"></select>
                <button id="newQuizMenuBtn" class="success">➕ Новая викторина</button>
                <button id="editQuizMenuBtn">✏️ Редактировать</button>
                <button id="deleteQuizMenuBtn" class="danger">🗑 Удалить</button>
                <button id="backupMenuBtn" class="success">💾 Резервная копия</button>
                <button id="restoreMenuBtn" class="warning">📂 Восстановить</button>
                <hr>
                <label>⏱ Таймер (сек):</label>
                <input type="number" id="globalTimerSecMenu" value="30" min="5" max="300" placeholder="Секунды">
            </div>
            <div class="modal-buttons">
                <button id="closeMenuBtn">Закрыть</button>
            </div>
            <input type="file" id="restoreFileInput" accept=".json" style="display:none">
        </div>
    </div>

    <div class="teams-panel">
        <div class="teams-header">
            <strong>👥 Команды</strong>
            <div>
                <button id="addTeamBtn">➕ Добавить команду</button>
                <button id="resetGameProgressBtn" class="warning">🔄 Сброс прогресса</button>
            </div>
        </div>
        <div id="teamsContainer" class="teams-list"></div>
    </div>

    <div class="game-grid">
        <table class="categories-table" id="gameTable">
            <thead id="tableHeader"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="questionModal" class="modal">
    <div class="modal-card" style="max-width:750px;">
        <h3 id="modalCatName">📂 Категория</h3>
        <div class="question-text" id="modalQuestionText">Вопрос</div>
        <div class="media-container" id="modalMedia"></div>
        <div class="timer-area">
            ⏱ <span id="timerDisplay">00</span> сек
        </div>
        <div class="modal-buttons">
            <button id="startTimerBtn" class="success">▶️ Старт</button>
            <button id="showAnswerBtn">📖 Ответ</button>
            <button id="correctAnswerBtn" class="success">✅ Верно</button>
            <button id="wrongAnswerBtn" class="danger">❌ Неверно</button>
            <button id="closeModalBtn">✖️ Закрыть</button>
        </div>
        <div id="answerReveal" style="display:none;">
            💡 <span id="answerText"></span>
        </div>
    </div>
</div>

<div id="editorModal" class="modal editor-modal">
    <div class="modal-card" style="max-width:1200px; max-height:85vh; overflow-y:auto;">
        <h2>🎮 Редактор викторины</h2>
        <label>Название: <input type="text" id="editQuizName" placeholder="Название викторины" style="width:100%"></label>
        <div id="categoriesEditorContainer"></div>
        <button id="addCategoryEditorBtn">➕ Добавить категорию</button>
        <hr>
        <div class="modal-buttons">
            <button id="saveQuizBtn" class="success">💾 Сохранить</button>
            <button id="closeEditorBtn">Отмена</button>
        </div>
        <small style="color: var(--text-muted);">💡 Медиа: вставьте ссылку (YouTube, .mp4) или загрузите файл (до 20 МБ)</small>
    </div>
</div>

<div id="customPromptModal" class="modal">
    <div class="modal-card">
        <h3 id="promptTitle">✏️ Ввод</h3>
        <input type="text" id="promptInput" placeholder="Введите значение">
        <div class="modal-buttons">
            <button id="promptOkBtn">ОК</button>
            <button id="promptCancelBtn">Отмена</button>
        </div>
    </div>
</div>

<div id="customAlertModal" class="modal">
    <div class="modal-card">
        <h3 id="alertTitle">💬 Сообщение</h3>
        <p id="alertMessage"></p>
        <div class="modal-buttons">
            <button id="alertOkBtn">OK</button>
        </div>
    </div>
</div>

<script>
    // ---------- ХРАНИЛИЩЕ МЕДИА (IndexedDB) ----------
    const mediaDB = (() => {
        const DB_NAME = 'svoya_media_db';
        const STORE_NAME = 'media';
        let db = null;

        function open() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                request.onsuccess = (event) => {
                    db = event.target.result;
                    resolve(db);
                };
                request.onerror = (event) => {
                    reject(event.target.error);
                };
            });
        }

        function ensureDB() {
            if (db) return Promise.resolve(db);
            return open();
        }

        async function saveMedia(id, blob) {
            await ensureDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const record = { id, blob };
                const request = store.put(record);
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function getMedia(id) {
            await ensureDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(id);
                request.onsuccess = () => {
                    resolve(request.result ? request.result.blob : null);
                };
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function deleteMedia(id) {
            await ensureDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(id);
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e.target.error);
            });
        }

        return { saveMedia, getMedia, deleteMedia, open };
    })();

    // ---------- ОСНОВНАЯ ЛОГИКА ----------
    let quizzes = [];
    let currentQuizId = null;
    let currentTeams = [];
    let currentTeamIndex = 0;
    let activeQuestionData = null;
    let timerInterval = null;
    let timerSecondsLeft = 0;

    const STORAGE_QUIZZES = "svoya_quizzes";
    const STORAGE_SESSION = "svoya_session";

    function customAlert(msg, title = "Сообщение") {
        return new Promise((resolve) => {
            const modal = document.getElementById("customAlertModal");
            document.getElementById("alertTitle").innerText = title;
            document.getElementById("alertMessage").innerText = msg;
            modal.style.display = "flex";
            const okBtn = document.getElementById("alertOkBtn");
            const handler = () => {
                modal.style.display = "none";
                okBtn.removeEventListener("click", handler);
                resolve();
            };
            okBtn.addEventListener("click", handler);
        });
    }

    function customPrompt(question, defaultValue = "") {
        return new Promise((resolve) => {
            const modal = document.getElementById("customPromptModal");
            document.getElementById("promptTitle").innerText = question;
            const input = document.getElementById("promptInput");
            input.value = defaultValue;
            modal.style.display = "flex";
            const okBtn = document.getElementById("promptOkBtn");
            const cancelBtn = document.getElementById("promptCancelBtn");
            const onOk = () => {
                modal.style.display = "none";
                okBtn.removeEventListener("click", onOk);
                cancelBtn.removeEventListener("click", onCancel);
                resolve(input.value);
            };
            const onCancel = () => {
                modal.style.display = "none";
                okBtn.removeEventListener("click", onOk);
                cancelBtn.removeEventListener("click", onCancel);
                resolve(null);
            };
            okBtn.addEventListener("click", onOk);
            cancelBtn.addEventListener("click", onCancel);
        });
    }

    function saveQuizzesToLocal() {
        try {
            localStorage.setItem(STORAGE_QUIZZES, JSON.stringify(quizzes));
        } catch (e) {
            if (e.name === 'QuotaExceededError' || e.toString().includes('quota')) {
                customAlert('Недостаточно места в хранилище браузера. Попробуйте удалить неиспользуемые медиафайлы или старые викторины.', 'Ошибка сохранения');
            } else {
                customAlert('Ошибка сохранения данных: ' + e.message, 'Ошибка');
            }
        }
    }

    function saveSession() {
        if(!currentQuizId) return;
        const quiz = quizzes.find(q => q.id == currentQuizId);
        if(!quiz) return;
        const usedStates = quiz.categories.map(cat => cat.questions.map(q => q.isUsed));
        const sessionData = { currentQuizId, teams: currentTeams, currentTeamIndex, usedStates };
        try {
            localStorage.setItem(STORAGE_SESSION, JSON.stringify(sessionData));
        } catch (e) {
            console.warn('Could not save session', e);
        }
    }

    function loadSession() {
        const sessRaw = localStorage.getItem(STORAGE_SESSION);
        if(sessRaw) {
            try {
                const sess = JSON.parse(sessRaw);
                if(quizzes.some(q=>q.id==sess.currentQuizId) && sess.teams?.length) {
                    currentQuizId = sess.currentQuizId;
                    currentTeams = sess.teams;
                    currentTeamIndex = sess.currentTeamIndex;
                    const quiz = quizzes.find(q=>q.id==currentQuizId);
                    if(quiz && sess.usedStates) {
                        for(let ci=0; ci<quiz.categories.length && ci<sess.usedStates.length; ci++)
                            for(let qi=0; qi<quiz.categories[ci].questions.length && qi<sess.usedStates[ci].length; qi++)
                                quiz.categories[ci].questions[qi].isUsed = sess.usedStates[ci][qi];
                    }
                    return true;
                }
            } catch(e) {}
        }
        return false;
    }

    function initDefaultTeams() { return [{ name: "Команда 1", score: 0 }, { name: "Команда 2", score: 0 }]; }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m=>({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    function nextTeam() {
        if (currentTeams.length === 0) return;
        currentTeamIndex = (currentTeamIndex + 1) % currentTeams.length;
    }

    function renderAll() {
        if(!currentQuizId) return;
        const quiz = quizzes.find(q=>q.id==currentQuizId);
        if(quiz) {
            document.getElementById("currentQuizNameBadge").innerText = quiz.name;
            renderTeamsPanel();
            renderGameGrid(quiz);

    function renderTeamsPanel() {
        const container = document.getElementById("teamsContainer");
        container.innerHTML = "";

            const card = document.createElement("div");
            card.className = `team-card ${idx===currentTeamIndex?'active':''}`;

                <div class="team-name">${escapeHtml(team.name)}</div>
                <div class="team-score">${team.score}</div>

            currentTeams.splice(idx,1);

    function renderGameGrid(quiz) {
        const thead = document.getElementById("tableHeader");
        const tbody = document.getElementById("tableBody");
        thead.innerHTML = ""; tbody.innerHTML = "";
        const cats = quiz.categories;
        if(!cats.length) return;
        const headerRow = document.createElement("tr");
        cats.forEach(cat=>{ let th=document.createElement("th"); th.innerText=cat.name; headerRow.appendChild(th); });
        thead.appendChild(headerRow);
        const maxRows = Math.max(...cats.map(c=>c.questions.length),0);
        for(let row=0; row<maxRows; row++){
            const tr=document.createElement("tr");
            for(let col=0; col<cats.length; col++){
                const td=document.createElement("td");
                const q=cats[col].questions[row];
                if(q){
                    td.innerText=q.value;
                    if(q.isUsed){ td.classList.add("used"); td.innerText="✔️"; }
                    else{ td.style.cursor="pointer"; td.addEventListener("click",(()=>openQuestion(col,row,q.value))); }
                } else { td.innerText="—"; td.classList.add("used"); }
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        }
    }

    async function openQuestion(catIdx,qIdx,value) {
    if(timerInterval) clearInterval(timerInterval);
    const quiz = quizzes.find(q=>q.id==currentQuizId);
    if(!quiz) return;
    const question = quiz.categories[catIdx]?.questions[qIdx];
    if(!question||question.isUsed) return;
    activeQuestionData = {catIdx,qIdx,value,quizId:currentQuizId};
    document.getElementById("modalCatName").innerHTML = `${quiz.categories[catIdx].name} — ${value} баллов`;
    document.getElementById("modalQuestionText").innerText = question.text;
    const mediaDiv = document.getElementById("modalMedia");
    mediaDiv.innerHTML = "";

    if(question.media && question.media.trim()){
        const mediaValue = question.media.trim();
        if (mediaValue.startsWith("db:")) {
            try {
                const blob = await mediaDB.getMedia(mediaValue);
                if (blob) {
                    const url = URL.createObjectURL(blob);
                    const isVideo = blob.type.startsWith('video/') || mediaValue.startsWith('db:v_');
                    if (isVideo) {
                        const video = document.createElement('video');
                        video.src = url;
                        video.controls = true;
                        video.preload = "auto";
                        video.style.maxWidth = "100%";
                        video.onerror = (e) => { video.style.display="none"; mediaDiv.innerHTML+="<p style='color:red'>⚠️ Видео не загружено. Возможно, формат не поддерживается браузером.</p>"; };
                        video.load();
                        mediaDiv.appendChild(video);
                    } else {
                        const img = document.createElement('img');
                        img.src = url;
                        img.alt = "Медиа";
                        img.onerror = () => { img.style.display="none"; mediaDiv.innerHTML+="<p style='color:orange'>Изображение не загружено</p>"; };
                        mediaDiv.appendChild(img);
                    }
                } else {
                    // Файл не найден – удаляем битую ссылку и сообщаем
                    question.media = "";
                    saveQuizzesToLocal();
                    mediaDiv.innerHTML = "<p style='color:orange'>⚠️ Медиафайл был удалён. Пожалуйста, загрузите его заново через редактор.</p>";
                }
            } catch (e) {
                question.media = "";
                saveQuizzesToLocal();
                mediaDiv.innerHTML = "<p style='color:red'>Ошибка загрузки медиа. Ссылка очищена.</p>";
            }
        } else {
            // Обработка обычных ссылок (YouTube, URL) остаётся без изменений
            let url = mediaValue;
            if(url.includes("youtube.com/watch")||url.includes("youtu.be")){
                let videoId="";
                if(url.includes("youtu.be")) videoId=url.split("/").pop().split("?")[0];
                else if(url.includes("v=")) videoId=url.split("v=")[1].split("&")[0];
                if(videoId){
                    let iframe=document.createElement("iframe");
                    iframe.src=`https://www.youtube.com/embed/${videoId}`;
                    iframe.width="100%"; iframe.height="250"; iframe.allowFullscreen=true;
                    mediaDiv.appendChild(iframe);
                } else mediaDiv.innerHTML="<p style='color:orange'>Не удалось распознать YouTube</p>";
            } else if(url.match(/\.(mp4|webm|ogg|mov|avi)(\?|#|$)/i)||url.startsWith("data:video/")){
                let video=document.createElement("video");
                video.src=url; video.controls=true; video.preload="auto"; video.style.maxWidth="100%";
                video.onerror=()=>{ video.style.display="none"; mediaDiv.innerHTML+="<p style='color:red'>⚠️ Видео не загружено. Возможно, формат не поддерживается браузером.</p>"; };
                video.load(); mediaDiv.appendChild(video);
            } else {
                let img=document.createElement("img");
                img.src=url; img.alt="Медиа";
                img.onerror=()=>{ img.style.display="none"; mediaDiv.innerHTML+="<p style='color:orange'>Изображение не загружено</p>"; };
                mediaDiv.appendChild(img);
            }
        }
    }

    document.getElementById("answerText").innerText = question.answer;
    document.getElementById("answerReveal").style.display = "none";
    let timerSec = parseInt(document.getElementById("globalTimerSecMenu").value)||30;
    document.getElementById("timerDisplay").innerText = timerSec;
    timerSecondsLeft = timerSec;
    if(timerInterval) clearInterval(timerInterval);
    document.getElementById("correctAnswerBtn").disabled = false;
    document.getElementById("wrongAnswerBtn").disabled = false;
    document.getElementById("startTimerBtn").style.display = "inline-block";
    document.getElementById("questionModal").style.display = "flex";
}
    function startTimerModal() {
        if(timerInterval) clearInterval(timerInterval);
        if(timerSecondsLeft<=0) return;
        timerInterval=setInterval(()=>{
            if(timerSecondsLeft<=1){
                clearInterval(timerInterval); timerInterval=null;
                document.getElementById("timerDisplay").innerText="0";
                if(activeQuestionData){
                    customAlert("⏰ Время вышло! Вопрос снимается, ход переходит.");
                    const quizNow=quizzes.find(q=>q.id==activeQuestionData.quizId);
                    if(quizNow){ const q=quizNow.categories[activeQuestionData.catIdx]?.questions[activeQuestionData.qIdx]; if(q && !q.isUsed) q.isUsed=true; }
                    nextTeam();
                    saveSession();
                    closeModalAndRefresh();
                }
            } else { timerSecondsLeft--; document.getElementById("timerDisplay").innerText=timerSecondsLeft; }
        },1000);
    }

    function closeModalAndRefresh() { if(timerInterval) clearInterval(timerInterval); document.getElementById("questionModal").style.display="none"; activeQuestionData=null; renderAll(); saveSession(); }

    function answerCorrect() {
        if(activeQuestionData){
            const quiz=quizzes.find(q=>q.id==activeQuestionData.quizId);
            if(quiz){
                const q=quiz.categories[activeQuestionData.catIdx]?.questions[activeQuestionData.qIdx];
                if(q&&!q.isUsed){
                    if(currentTeams[currentTeamIndex]) currentTeams[currentTeamIndex].score+=activeQuestionData.value;
                    q.isUsed=true;
                    nextTeam();
                    saveSession();
                    closeModalAndRefresh();
                }
            }
        }
    }
    function answerWrong() {
        if(activeQuestionData){
            const quiz=quizzes.find(q=>q.id==activeQuestionData.quizId);
            if(quiz){
                const q=quiz.categories[activeQuestionData.catIdx]?.questions[activeQuestionData.qIdx];
                if(q) q.isUsed=true;
                nextTeam();
                saveSession();
                closeModalAndRefresh();
            }
        }
    }
    
    let editingQuizId=null;

    function openEditor(quizId) {
        const quiz = quizzes.find(q=>q.id==quizId);
        if(!quiz) return;
        editingQuizId=quizId;
        document.getElementById("editQuizName").value=quiz.name;
        const container=document.getElementById("categoriesEditorContainer");
        container.innerHTML="";
        quiz.categories.forEach((cat,idx)=>{
            const catDiv=document.createElement("div"); catDiv.className="editor-category";
            catDiv.innerHTML=`<strong>Категория ${idx+1}</strong> <input type="text" class="cat-name-input" value="${escapeHtml(cat.name)}" placeholder="Название категории" data-catidx="${idx}" style="width:70%"><button class="delCatBtn" data-catidx="${idx}">🗑 Удалить</button>`;
            const questionsDiv=document.createElement("div");
            cat.questions.forEach((q,qidx)=>{
                const qDiv=document.createElement("div"); qDiv.className="question-row";
                // Отображаем медиа-поле: если ключ db:, показываем упрощенно
                let mediaDisplay = q.media;
                if (mediaDisplay && mediaDisplay.startsWith("db:")) {
                    mediaDisplay = "[Локальный файл]";
                }
                qDiv.innerHTML=`
                    <input type="number" class="q-value" value="${q.value}" step="100" placeholder="Очки" data-cat="${idx}" data-qidx="${qidx}" style="width:85px">
                    <input type="text" class="q-text" value="${escapeHtml(q.text)}" placeholder="Вопрос" data-cat="${idx}" data-qidx="${qidx}" style="min-width:200px">
                    <input type="text" class="q-answer" value="${escapeHtml(q.answer)}" placeholder="Ответ" data-cat="${idx}" data-qidx="${qidx}">
                    <input type="text" class="q-media" value="${escapeHtml(mediaDisplay)}" placeholder="Ссылка на медиа" data-cat="${idx}" data-qidx="${qidx}">
                    <button class="uploadMediaBtn" data-cat="${idx}" data-qidx="${qidx}">📁 Загрузить</button>
                    <button class="delQuestionBtn" data-cat="${idx}" data-qidx="${qidx}">❌</button>
                `;
                questionsDiv.appendChild(qDiv);
            });
            catDiv.appendChild(questionsDiv);
            const addQBtn=document.createElement("button"); addQBtn.innerText="+ Добавить вопрос"; addQBtn.dataset.catidx=idx;
            addQBtn.addEventListener("click",()=>{ const lastVal=quiz.categories[idx].questions.at(-1)?.value||0; quiz.categories[idx].questions.push({value:lastVal+100,text:"Поздравляем, вы получаете эти баллы просто так",answer:"Вопроса не будет",media:"",isUsed:false}); openEditor(quiz.id); });
            catDiv.appendChild(addQBtn);
            container.appendChild(catDiv);
        });
        const globalAddBtn = document.createElement("button");
        globalAddBtn.innerText = "➕ Добавить во все категории";
        globalAddBtn.style.marginTop = "12px";
        globalAddBtn.addEventListener("click", () => {
            const lastVals = quiz.categories.map(c => c.questions.at(-1)?.value || 0);
            const newVal = Math.max(...lastVals) + 100;
            quiz.categories.forEach(cat => cat.questions.push({value:newVal, text:"Поздравляем, вы получаете эти баллы просто так", answer:"Вопроса не будет", media:"", isUsed:false}));
            openEditor(quiz.id);
        });
        container.appendChild(globalAddBtn);
        attachEditorEvents(quiz);
        document.getElementById("editorModal").style.display="flex";
    }

    function attachEditorEvents(quiz) {
        document.querySelectorAll(".delCatBtn").forEach(btn=>btn.addEventListener("click",()=>{ let ci=parseInt(btn.dataset.catidx); if(quiz.categories.length>1){ quiz.categories.splice(ci,1); openEditor(quiz.id); } else customAlert("Нужна хотя бы одна категория"); }));
        document.querySelectorAll(".delQuestionBtn").forEach(btn=>btn.addEventListener("click",()=>{ let qi=parseInt(btn.dataset.qidx); quiz.categories.forEach(cat => cat.questions.splice(qi, 1)); openEditor(quiz.id); }));
        document.querySelectorAll(".uploadMediaBtn").forEach(btn=>btn.addEventListener("click",async()=>{
            let ci=parseInt(btn.dataset.cat), qi=parseInt(btn.dataset.qidx);
            let question=quiz.categories[ci].questions[qi];
            // Предлагаем ввести URL или загрузить файл
            let userURL = await customPrompt("Введите URL видео/изображения (Enter) или нажмите Отмена для выбора файла:", question.media && !question.media.startsWith("db:") ? question.media : "");
            if(userURL !== null && userURL.trim() !== "") {
                // Удаляем старый локальный файл из IndexedDB, если был
                if (question.media && question.media.startsWith("db:")) {
                    await mediaDB.deleteMedia(question.media).catch(()=>{});
                }
                question.media = userURL.trim();
                openEditor(quiz.id);
                return;
            }
            // Загрузка файла
            const fileInput=document.createElement("input");
            fileInput.type="file";
            fileInput.accept="image/*,video/*";
            fileInput.onchange=async (ev)=>{
                const file=ev.target.files[0];
                if(!file) return;
                if(file.size > 20 * 1024 * 1024){
                    await customAlert("Файл слишком большой (>20 МБ). Пожалуйста, используйте ссылку.");
                    return;
                }
                // Удаляем старое медиа из IndexedDB
                if (question.media && question.media.startsWith("db:")) {
                    await mediaDB.deleteMedia(question.media).catch(()=>{});
                }
                // Сохраняем как Blob в IndexedDB
                const prefix = file.type.startsWith('video/') ? 'db:v_' : 'db:i_';
                const mediaId = prefix + Date.now() + '_' + Math.random().toString(36);
                try {
                    await mediaDB.saveMedia(mediaId, file);
                    question.media = mediaId;
                    openEditor(quiz.id);
                } catch (e) {
                    await customAlert('Ошибка сохранения медиафайла: ' + e.message);
                }
            };
            fileInput.click();
        }));
    }

    function saveCurrentEditor() {
        if(!editingQuizId) return;
        const quiz=quizzes.find(q=>q.id==editingQuizId);
        if(!quiz) return;
        quiz.name=document.getElementById("editQuizName").value;
        document.querySelectorAll(".cat-name-input").forEach(inp=>{ let ci=parseInt(inp.dataset.catidx); if(quiz.categories[ci]) quiz.categories[ci].name=inp.value; });
        document.querySelectorAll(".q-value").forEach(inp=>{ let ci=parseInt(inp.dataset.cat), qi=parseInt(inp.dataset.qidx); if(quiz.categories[ci]?.questions[qi]) quiz.categories[ci].questions[qi].value=parseInt(inp.value)||100; });
        document.querySelectorAll(".q-text").forEach(inp=>{ let ci=parseInt(inp.dataset.cat), qi=parseInt(inp.dataset.qidx); if(quiz.categories[ci]?.questions[qi]) quiz.categories[ci].questions[qi].text=inp.value; });
        document.querySelectorAll(".q-answer").forEach(inp=>{ let ci=parseInt(inp.dataset.cat), qi=parseInt(inp.dataset.qidx); if(quiz.categories[ci]?.questions[qi]) quiz.categories[ci].questions[qi].answer=inp.value; });
        // Для медиа-поля: если пользователь стер значение или ввел новое, обрабатываем
        document.querySelectorAll(".q-media").forEach(inp=>{ 
            let ci=parseInt(inp.dataset.cat), qi=parseInt(inp.dataset.qidx); 
            if(quiz.categories[ci]?.questions[qi]) {
                let newMedia = inp.value.trim();
                // Если было локальное, а стало пусто или другое – удалим старое из базы
                const oldMedia = quiz.categories[ci].questions[qi].media;
                if (oldMedia && oldMedia.startsWith("db:") && oldMedia !== newMedia && newMedia !== "[Локальный файл]") {
                    mediaDB.deleteMedia(oldMedia).catch(()=>{});
                }
                if (newMedia === "" && oldMedia && oldMedia.startsWith("db:")) {
                    quiz.categories[ci].questions[qi].media = "";
                } else if (newMedia !== "[Локальный файл]") {
                    quiz.categories[ci].questions[qi].media = newMedia;
                }
            }
        });
        saveQuizzesToLocal();
        if(currentQuizId==editingQuizId) renderAll();
        closeEditor();
    }

    function closeEditor() { document.getElementById("editorModal").style.display="none"; editingQuizId=null; }
    function addCategoryInEditor() { const quiz=quizzes.find(q=>q.id==editingQuizId); if(quiz){ quiz.categories.push({name:"Новая категория",questions:[{value:100,text:"Пример",answer:"Ответ",media:"",isUsed:false}]}); openEditor(editingQuizId); } }

        const select=document.getElementById("quizSelectMenu");
        select.innerHTML="";

    async function deleteCurrentQuiz() {
        if(!currentQuizId) return;
        if(quizzes.length<=1){ await customAlert("Нельзя удалить последнюю викторину"); return; }
        // Удаляем связанные медиа из IndexedDB
        const quizToDelete = quizzes.find(q=>q.id==currentQuizId);
        if (quizToDelete) {
            for (let cat of quizToDelete.categories) {
                for (let q of cat.questions) {
                    if (q.media && q.media.startsWith("db:")) {
                        await mediaDB.deleteMedia(q.media).catch(()=>{});
                    }
                }
            }
        }
        quizzes=quizzes.filter(q=>q.id!=currentQuizId);
        saveQuizzesToLocal();
        currentQuizId=quizzes[0].id;
        currentTeams=initDefaultTeams();
        currentTeamIndex=0;
        saveSession();
        renderQuizSelectMenu();
        renderAll();
    }
    function backupAll() {
        // Предупреждаем, что локальные файлы не сохранятся
        customAlert("Резервная копия сохранит только структуру викторины и ссылки. Загруженные файлы (видео/изображения) не включаются в JSON-файл.", "Внимание").then(()=>{
            const dataStr=JSON.stringify(quizzes,null,2);
            const blob=new Blob([dataStr],{type:"application/json"});
            const a=document.createElement("a");
            a.href=URL.createObjectURL(blob);
            a.download=`svoya_backup_${new Date().toISOString().slice(0,19)}.json`;
            a.click();
            URL.revokeObjectURL(a.href);
        });
    }
    function restoreFromFile(file) { 
        const reader=new FileReader(); 
        reader.onload= async (e)=>{ 
            try{ 
                const restored=JSON.parse(e.target.result); 
                if(Array.isArray(restored) && restored.length && restored[0].categories){ 
                    quizzes=restored; 
                    saveQuizzesToLocal(); 
                    if(!quizzes.some(q=>q.id==currentQuizId)) currentQuizId=quizzes[0].id; 
                    currentTeams=initDefaultTeams(); 
                    currentTeamIndex=0; 
                    saveSession(); 
                    renderQuizSelectMenu(); 
                    renderAll(); 
                    await customAlert("Восстановление успешно! Локальные медиафайлы не переносятся, их нужно загрузить заново."); 
                } else await customAlert("Неверный формат файла"); 
            } catch(err){ 
                await customAlert("Ошибка чтения файла"); 
            } 
        }; 
        reader.readAsText(file); 
    }
    function resetGameProgress() { if(currentQuizId){ const quiz=quizzes.find(q=>q.id==currentQuizId); if(quiz) quiz.categories.forEach(c=>c.questions.forEach(q=>q.isUsed=false)); currentTeams=currentTeams.map(t=>({...t,score:0})); currentTeamIndex=0; saveSession(); renderAll(); customAlert("Прогресс сброшен"); } }
    async function addTeam() { let newName = await customPrompt("Название команды", "Новая команда"); if(newName) { currentTeams.push({ name: newName, score:0 }); renderAll(); saveSession(); } }

    async function init() {
        // Открываем базу IndexedDB заранее
        try { await mediaDB.open(); } catch (e) { console.warn('IndexedDB не доступна', e); }
        loadQuizzes();
        const sessionLoaded=loadSession();
        if(!sessionLoaded || !currentQuizId){ currentQuizId=quizzes[0]?.id||null; if(currentQuizId) currentTeams=initDefaultTeams(); currentTeamIndex=0; saveSession(); }
        renderQuizSelectMenu();
        renderAll();

        document.getElementById("openMenuBtn").onclick=()=>document.getElementById("menuModal").style.display="flex";
        document.getElementById("closeMenuBtn").onclick=()=>document.getElementById("menuModal").style.display="none";
        document.getElementById("quizSelectMenu").addEventListener("change",(e)=>{ currentQuizId=parseInt(e.target.value); currentTeams=initDefaultTeams(); currentTeamIndex=0; const quiz=quizzes.find(q=>q.id==currentQuizId); if(quiz) quiz.categories.forEach(c=>c.questions.forEach(q=>q.isUsed=false)); saveSession(); renderAll(); document.getElementById("menuModal").style.display="none"; });
        document.getElementById("newQuizMenuBtn").onclick=()=>{ newQuiz(); document.getElementById("menuModal").style.display="none"; };
        document.getElementById("editQuizMenuBtn").onclick=()=>{ if(currentQuizId) openEditor(currentQuizId); document.getElementById("menuModal").style.display="none"; };
        document.getElementById("deleteQuizMenuBtn").onclick=()=>{ deleteCurrentQuiz(); document.getElementById("menuModal").style.display="none"; };
        document.getElementById("backupMenuBtn").onclick=()=>{ backupAll(); document.getElementById("menuModal").style.display="none"; };
        document.getElementById("restoreMenuBtn").onclick=()=>{ document.getElementById("restoreFileInput").click(); document.getElementById("menuModal").style.display="none"; };
        document.getElementById("restoreFileInput").onchange=(e)=>{ if(e.target.files.length) restoreFromFile(e.target.files[0]); e.target.value=''; };
        document.getElementById("addTeamBtn").onclick=()=>addTeam();
        document.getElementById("resetGameProgressBtn").onclick=()=>resetGameProgress();

        document.getElementById("startTimerBtn").onclick=startTimerModal;
        document.getElementById("showAnswerBtn").onclick=()=>document.getElementById("answerReveal").style.display="block";
        document.getElementById("correctAnswerBtn").onclick=answerCorrect;
        document.getElementById("wrongAnswerBtn").onclick=answerWrong;
        document.getElementById("closeModalBtn").onclick=closeModalAndRefresh;
        document.getElementById("saveQuizBtn").onclick=saveCurrentEditor;
        document.getElementById("closeEditorBtn").onclick=closeEditor;
        document.getElementById("addCategoryEditorBtn").onclick=addCategoryInEditor;
    }
    init();
</script>
</body>
</html>
