<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Своя Игра — Викторина</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-container">
    <div class="top-bar">
        <button id="openMenuBtn" class="menu-btn">☰ Меню</button>
        <div class="quiz-name-badge" id="currentQuizNameBadge"></div>
        <div class="top-bar-actions">
            <span id="hostModeIndicator" style="display:none;font-size:0.75rem;background:var(--warning);color:white;padding:3px 8px;border-radius:var(--radius-sm);">🎭 Ведущий</span>
        </div>
    </div>

    <div id="menuModal" class="modal">
        <div class="modal-card modal-menu-card">
            <h3>Управление</h3>
            <div class="menu-group">
                <div class="menu-section">
                    <label>Викторина</label>
                    <select id="quizSelectMenu"></select>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        <button id="newQuizMenuBtn" class="success">➕ Новая</button>
                        <button id="editQuizMenuBtn">✏️ Редактировать</button>
                        <button id="deleteQuizMenuBtn" class="danger">🗑 Удалить</button>
                    </div>
                </div>
                <div class="menu-section">
                    <label>Игра</label>
                    <div class="menu-toggle">
                        <span class="menu-toggle-label">Случайный порядок</span>
                        <button id="shuffleToggle" class="toggle-switch"></button>
                    </div>
                    <button id="printQuizBtn" style="width:100%;text-align:left;">🖨 Печать викторины</button>
                </div>
                <div class="menu-section">
                    <label>Настройки</label>
                    <div class="menu-toggle">
                        <span class="menu-toggle-label">Режим ведущего</span>
                        <button id="hostModeToggle" class="toggle-switch"></button>
                    </div>
                    <label style="font-size:0.8rem;color:var(--text-secondary);">Таймер (сек)</label>
                    <input type="number" id="globalTimerSecMenu" value="30" min="5" max="300" placeholder="30">
                </div>
                <div class="menu-section">
                    <label>Данные</label>
                    <div style="display:flex;gap:6px;flex-wrap:wrap;">
                        <button id="backupMenuBtn" class="success">💾 Экспорт</button>
                        <button id="restoreMenuBtn" class="warning">📂 Импорт</button>
                    </div>
                </div>
            </div>
            <div class="modal-buttons">
                <button id="closeMenuBtn">Закрыть</button>
            </div>
            <input type="file" id="restoreFileInput" accept=".json" style="display:none">
        </div>
    </div>

    <div class="teams-panel">
        <div class="teams-header">
            <strong>Команды</strong>
            <div class="teams-header-actions">
                <button id="resetGameProgressBtn" class="danger" style="font-size:0.8rem;">🔄 Сброс</button>
            </div>
        </div>
        <div id="teamsContainer" class="teams-list"></div>
    </div>

    <div class="game-grid">
        <table class="categories-table" id="gameTable">
            <thead id="tableHeader"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<div id="questionModal" class="modal question-modal">
    <div class="modal-card">
        <h3 id="modalCatName">Категория</h3>
        <div class="question-text" id="modalQuestionText">Вопрос</div>
        <div class="media-container" id="modalMedia"></div>
        <div class="timer-area">
            <span id="timerDisplay">00</span> сек
            <div class="timer-bar" id="timerBar"></div>
        </div>
        <div class="modal-buttons">
            <button id="startTimerBtn" class="success">▶️ Старт</button>
            <button id="showAnswerBtn">📖 Ответ</button>
            <button id="correctAnswerBtn" class="success">✅ Верно</button>
            <button id="wrongAnswerBtn" class="danger">❌ Неверно</button>
            <button id="closeModalBtn">✖️ Закрыть</button>
        </div>
        <div id="answerReveal" style="display:none;">
            <strong>Ответ:</strong> <span id="answerText"></span>
        </div>
    </div>
</div>

<div id="teamActionsModal" class="modal team-actions-modal">
    <div class="modal-card">
        <div class="team-actions-name" id="teamActionsName"></div>
        <div class="team-actions-score" id="teamActionsScore"></div>
        <div class="team-actions-list">
            <button id="teamActionSetCurrent">🎯 Сделать текущей</button>
            <button id="teamActionChangeScore">💰 Изменить очки</button>
            <button id="teamActionRename">✏️ Переименовать</button>
            <button id="teamActionRemove" class="danger">🗑 Удалить команду</button>
        </div>
        <div class="modal-buttons">
            <button id="teamActionsClose">Закрыть</button>
        </div>
    </div>
</div>

<div id="editorModal" class="modal editor-modal">
    <div class="modal-card">
        <h2>Редактор викторины</h2>
        <label style="font-size:0.8rem;color:var(--text-secondary);">Название</label>
        <input type="text" id="editQuizName" placeholder="Название викторины">
        <div id="categoriesEditorContainer"></div>
        <button id="addCategoryEditorBtn" style="width:100%;margin-top:8px;">➕ Добавить категорию</button>
        <hr>
        <div class="modal-buttons">
            <button id="saveQuizBtn" class="success">💾 Сохранить</button>
            <button id="closeEditorBtn">Отмена</button>
        </div>
        <small style="color:var(--text-secondary);font-size:0.75rem;">Медиа: YouTube, ссылка (.mp4, .mp3, .jpg) или файл (до 20 МБ)</small>
    </div>
</div>

<div id="customPromptModal" class="modal">
    <div class="modal-card">
        <h3 id="promptTitle">Ввод</h3>
        <input type="text" id="promptInput" placeholder="Введите значение">
        <div class="modal-buttons">
            <button id="promptOkBtn" class="success">ОК</button>
            <button id="promptCancelBtn">Отмена</button>
        </div>
    </div>
</div>

<div id="customAlertModal" class="modal">
    <div class="modal-card">
        <h3 id="alertTitle">Сообщение</h3>
        <p id="alertMessage" style="margin:8px 0;line-height:1.4;"></p>
        <div class="modal-buttons">
            <button id="alertOkBtn" class="success">OK</button>
        </div>
    </div>
</div>

<div id="mediaUploadModal" class="modal">
    <div class="modal-card">
        <h3>Загрузка медиа</h3>
        <label style="font-size:0.8rem;color:var(--text-secondary);">URL видео/изображения/аудио</label>
        <input type="text" id="mediaUrlInput" placeholder="https://...">
        <div class="modal-buttons" style="flex-direction:column;gap:6px;">
            <button id="mediaUploadOk" class="success" style="width:100%;">OK — загрузить по ссылке</button>
            <button id="mediaUploadBrowse" style="width:100%;">📁 Обзор — выбрать файл</button>
            <button id="mediaUploadCancel" style="width:100%;">Отмена</button>
        </div>
    </div>
</div>

<script src="state.js"></script>
<script src="model.js"></script>
<script src="ui.js"></script>
<script src="game.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>
</body>
</html>
